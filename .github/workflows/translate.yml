name: 自动批量翻译 PDF

on:
  push:
    paths:
      - 'input_pdfs/**.pdf'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库文件
        uses: actions/checkout@v4

      - name: 2. 配置 Python 与 OCR 识别引擎
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装 OCR 与翻译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng ghostscript
          pip install pymupdf deep-translator ocrmypdf

      - name: 3. 运行带 OCR 的批量翻译脚本
        run: python batch_translate.py

      - name: 4. 打包翻译结果供下载
        uses: actions/upload-artifact@v4
        with:
          name: translated-pdfs-result
          path: translated_pdfs/
